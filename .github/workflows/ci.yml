name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          # mypy optional extras — skip untyped ipywidgets in CI gate
          pip install mypy types-PyYAML 2>/dev/null || true
      - name: Ruff
        run: |
          ruff check python tests main.py
          ruff format --check python tests main.py
      - name: Tests
        run: |
          pytest
