name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy types-PyYAML
          # aiodoo_model / aiodoo_validation are sibling ecosystem repositories
          # consumed in-process (Phase 8 — see ECOSYSTEM_ADOPTION.md Section 3/4),
          # not published to PyPI. This checkout-relative install/path only
          # resolves when this workflow runs inside the multi-repo AIODOO
          # workspace (all sibling repos checked out side by side); when they
          # are unavailable, packaging/validation-specific tests self-skip via
          # pytest.importorskip rather than failing the whole suite.
          pip install -e ../aiodoo-model 2>/dev/null || true
      - name: Ruff
        run: |
          ruff check python tests main.py
          ruff format --check python tests main.py
      - name: Mypy
        run: |
          mypy
      - name: Tests
        env:
          PYTHONPATH: ../aiodoo-validation
        run: |
          pytest
